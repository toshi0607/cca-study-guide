name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only Chromium is exercised (see playwright.config.ts projects).
      - run: pnpm exec playwright install --with-deps chromium
      # webServer builds a fresh production preview and runs the full suite at
      # the committed worker count (playwright.config.ts default = 1; a sweep
      # found 2 workers flaky on this suite). This is the merge gate — never the
      # fast or reuse variants, so it can't run against a stale build or skip
      # @slow. To try parallel on a beefier runner, set PW_WORKERS here.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
